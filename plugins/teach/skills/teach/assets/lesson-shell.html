<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23222222'/%3E%3Cpath d='M17 18h30M32 18v30' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <title>Teach lesson</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #222222;
      --muted: #6a6a6a;
      --line: #dddddd;
      --quiet: #f7f7f7;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      color: var(--paper);
      background: var(--ink);
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .progress-track {
      position: fixed;
      z-index: 60;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #eeeeee;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--ink);
    }

    .topbar {
      position: sticky;
      z-index: 50;
      top: 2px;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px clamp(18px, 4vw, 56px);
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #e6e6e6;
      backdrop-filter: blur(12px);
    }

    .wordmark {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .subject {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero {
      width: min(1060px, calc(100% - 40px));
      margin: 0 auto;
      padding: clamp(72px, 9vw, 108px) 0 clamp(64px, 8vw, 92px);
    }

    .eyebrow,
    .kicker,
    .nav-label,
    .visual-label {
      color: var(--muted);
      font-size: 0.71rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin-bottom: 22px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2 {
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: -0.045em;
    }

    h1 {
      max-width: 820px;
      font-size: clamp(3rem, 5.4vw, 5rem);
      line-height: 1.02;
    }

    h2 {
      max-width: 760px;
      font-size: clamp(2.15rem, 4vw, 3.6rem);
      line-height: 1.05;
    }

    .hero-deck {
      max-width: 660px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: clamp(1.08rem, 1.6vw, 1.25rem);
    }

    .hero-meta {
      display: flex;
      gap: 12px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .hero-meta span + span::before {
      content: "·";
      margin-right: 12px;
    }

    .learning-goal {
      max-width: 760px;
      margin-top: 34px;
      padding: 20px 0;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--line);
    }

    .learning-goal strong {
      display: block;
      margin-bottom: 5px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .learning-goal p {
      margin: 0;
      font-size: clamp(1.02rem, 1.4vw, 1.15rem);
    }

    .lesson {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: clamp(36px, 6vw, 76px);
      align-items: start;
    }

    .lesson-nav {
      position: sticky;
      top: 92px;
      padding: 16px 0 64px;
    }

    .nav-label {
      margin-bottom: 10px;
    }

    .nav-items {
      display: grid;
      gap: 4px;
    }

    .nav-button {
      width: 100%;
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 8px;
      align-items: center;
      padding: 8px;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 0;
      line-height: 1.25;
    }

    .nav-button:hover,
    .nav-button.active {
      color: var(--ink);
      background: var(--quiet);
      box-shadow: inset 2px 0 0 var(--ink);
    }

    .nav-number {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      font-size: 0.68rem;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .chapter {
      padding: clamp(64px, 8vw, 96px) 0;
      border-top: 1px solid var(--line);
    }

    .kicker {
      margin-bottom: 14px;
    }

    .chapter-copy {
      max-width: 800px;
      margin-bottom: 34px;
      color: var(--muted);
      font-size: clamp(1.04rem, 1.4vw, 1.18rem);
    }

    .takeaway {
      margin-top: 30px;
      padding: 18px 0 18px 22px;
      border-left: 3px solid var(--ink);
      font-weight: 600;
    }

    .worked-example {
      margin-top: 8px;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--line);
    }

    .example-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .example-state {
      padding: 22px 24px 24px 0;
    }

    .example-state + .example-state {
      padding-left: 24px;
      border-left: 1px solid var(--line);
    }

    .example-state strong,
    .step-area,
    .technology-note strong {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .example-state p {
      margin: 8px 0 0;
    }

    .example-insight {
      margin: 0;
      padding: 18px 0;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    .visual {
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid #cccccc;
      border-radius: 12px;
    }

    .visual-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .visual-header h3 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.55rem);
      letter-spacing: -0.025em;
    }

    .visual-label {
      flex: 0 0 auto;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(var(--count), minmax(100px, 1fr));
      gap: 26px;
    }

    .flow-step {
      position: relative;
      min-width: 0;
      min-height: 138px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 8px;
      padding: 14px;
      text-align: center;
      background: var(--paper);
      border: 1px solid #cccccc;
      border-radius: 8px;
    }

    .flow-step:not(:last-child)::after {
      position: absolute;
      top: 50%;
      left: calc(100% + 1px);
      width: 27px;
      height: 2px;
      content: "";
      background: #cccccc;
      transform: translateY(-50%);
    }

    .flow-step:hover,
    .flow-step.active {
      color: var(--paper);
      background: var(--ink);
      border-color: var(--ink);
    }

    .step-number {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      font-size: 0.68rem;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .step-area {
      color: inherit;
      font-size: 0.62rem;
      line-height: 1.2;
    }

    .step-label {
      font-weight: 650;
      line-height: 1.25;
    }

    .visual-detail {
      min-height: 110px;
      margin-top: 22px;
      padding: 18px 20px;
      background: var(--quiet);
      border-radius: 8px;
    }

    .visual-detail h4 {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .visual-detail p {
      margin-bottom: 0;
      color: var(--muted);
    }

    .technology-note {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .technology-note strong {
      margin-bottom: 5px;
      color: var(--ink);
    }

    .learning-check {
      width: min(1060px, calc(100% - 40px));
      margin: 0 auto;
      padding: clamp(64px, 8vw, 96px) 0;
      border-top: 1px solid var(--line);
    }

    .learning-check h2 {
      max-width: 850px;
      font-size: clamp(1.8rem, 3.2vw, 2.8rem);
    }

    .check-instruction {
      color: var(--muted);
    }

    .learning-check details {
      margin-top: 26px;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--line);
    }

    .learning-check summary {
      padding: 18px 2px;
      font-weight: 600;
      cursor: pointer;
    }

    .check-answer {
      max-width: 780px;
      padding: 0 0 22px;
    }

    .check-answer p {
      margin-bottom: 10px;
    }

    .check-why {
      color: var(--muted);
    }

    footer {
      padding: 34px 20px 44px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid #e6e6e6;
      font-size: 0.72rem;
    }

    @media (max-width: 900px) {
      .lesson {
        display: block;
      }

      .lesson-nav {
        z-index: 40;
        top: 64px;
        margin: 0 -20px;
        padding: 8px 20px;
        background: rgba(255, 255, 255, 0.97);
        border-bottom: 1px solid var(--line);
      }

      .nav-label {
        display: none;
      }

      .nav-items {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
      }

      .nav-button {
        width: 100%;
        display: block;
        min-width: 0;
        padding: 10px 6px;
        text-align: center;
        font-size: 0.78rem;
      }

      .nav-button:hover,
      .nav-button.active {
        box-shadow: inset 0 -2px 0 var(--ink);
      }

      .nav-number {
        display: none;
      }

      .chapter {
        scroll-margin-top: 150px;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        padding-inline: 16px;
      }

      .hero {
        width: min(100% - 36px, 1060px);
        padding: 54px 0 58px;
      }

      h1 {
        font-size: clamp(2.65rem, 13vw, 4rem);
      }

      .lesson {
        width: min(100% - 36px, 1120px);
      }

      .lesson-nav {
        margin-inline: -18px;
      }

      .chapter {
        padding: 56px 0;
      }

      .flow {
        grid-template-columns: 1fr;
      }

      .example-grid {
        grid-template-columns: 1fr;
      }

      .example-state {
        padding-right: 0;
      }

      .example-state + .example-state {
        padding-left: 0;
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .flow-step:not(:last-child)::after {
        top: calc(100% + 1px);
        left: 50%;
        width: 2px;
        height: 27px;
        transform: translateX(-50%);
      }

      .learning-check {
        width: min(100% - 36px, 1060px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#lesson">Skip to lesson</a>
  <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="page-progress"></div></div>
  <header class="topbar">
    <div class="wordmark">teach</div>
    <div class="subject" id="subject"></div>
  </header>
  <main id="app"></main>
  <footer>Teach generates and stores the finished lesson locally. It does not publish or host the page.</footer>

  <script>
    "use strict";

    const LESSON = /*__TEACH_LESSON_DATA__*/;

    function make(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined && text !== null) element.textContent = String(text);
      return element;
    }

    function append(parent) {
      for (let index = 1; index < arguments.length; index += 1) {
        const child = arguments[index];
        if (child) parent.appendChild(child);
      }
      return parent;
    }

    function renderHero() {
      const hero = make("section", "hero");
      const meta = make("div", "hero-meta");
      append(
        meta,
        make("span", "", LESSON.meta.minutes + " minute read"),
        make("span", "", "3 connected parts")
      );
      append(
        hero,
        make("div", "eyebrow", "Learning module"),
        make("h1", "", LESSON.meta.title),
        make("p", "hero-deck", LESSON.meta.one_liner),
        meta,
        append(
          make("div", "learning-goal"),
          make("strong", "", "What you will learn"),
          make("p", "", LESSON.meta.learning_goal)
        )
      );
      return hero;
    }

    function selectStep(buttons, detail, item, selected) {
      buttons.forEach(function (control) {
        const active = control === selected;
        control.classList.toggle("active", active);
        control.setAttribute("aria-pressed", active ? "true" : "false");
      });
      const content = [make("h4", "", item.label), make("p", "", item.detail)];
      if (item.technology) {
        content.push(
          append(
            make("p", "technology-note"),
            make("strong", "", item.technology.name),
            document.createTextNode(item.technology.explanation)
          )
        );
      }
      detail.replaceChildren.apply(detail, content);
    }

    function renderFlow(visual) {
      const card = make("div", "visual");
      const header = make("div", "visual-header");
      append(
        header,
        make("h3", "", visual.title || "What happens"),
        make("span", "visual-label", visual.steps.length + " steps")
      );
      const flow = make("div", "flow");
      flow.style.setProperty("--count", visual.steps.length);
      const detail = make("div", "visual-detail");
      detail.id = "flow-detail";
      detail.setAttribute("role", "status");
      detail.setAttribute("aria-live", "polite");
      detail.setAttribute("aria-atomic", "true");
      const buttons = [];

      visual.steps.forEach(function (item, index) {
        const control = make("button", "flow-step");
        control.type = "button";
        append(
          control,
          make("span", "step-area", item.area_name),
          make("span", "step-number", index + 1),
          make("span", "step-label", item.label)
        );
        control.setAttribute("aria-controls", detail.id);
        control.addEventListener("click", function () {
          selectStep(buttons, detail, item, control);
        });
        buttons.push(control);
        flow.appendChild(control);
      });

      selectStep(buttons, detail, visual.steps[0], buttons[0]);
      append(card, header, flow, detail);
      return card;
    }

    function renderExample(example) {
      if (!example) return null;
      const block = make("div", "worked-example");
      const grid = make("div", "example-grid");
      append(
        grid,
        append(
          make("div", "example-state"),
          make("strong", "", "Before"),
          make("p", "", example.before)
        ),
        append(
          make("div", "example-state"),
          make("strong", "", "After"),
          make("p", "", example.after)
        )
      );
      append(block, grid, make("p", "example-insight", example.insight));
      return block;
    }

    function renderLesson() {
      const shell = make("div", "lesson");
      shell.id = "lesson";
      const nav = make("nav", "lesson-nav");
      nav.setAttribute("aria-label", "Lesson parts");
      append(nav, make("div", "nav-label", "Your path"));
      const navItems = make("div", "nav-items");
      const chapters = make("div", "chapters");
      const navLabels = ["Why it exists", "What changed", "How it works"];
      const navButtons = [];

      LESSON.story.forEach(function (chapter, index) {
        const navButton = make("button", "nav-button");
        navButton.type = "button";
        append(
          navButton,
          make("span", "nav-number", String(index + 1).padStart(2, "0")),
          make("span", "", navLabels[index])
        );
        navButton.addEventListener("click", function () {
          const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          document.getElementById(chapter.id).scrollIntoView({
            behavior: reduceMotion ? "auto" : "smooth",
            block: "start"
          });
        });
        navButtons.push(navButton);
        navItems.appendChild(navButton);

        const section = make("section", "chapter");
        section.id = chapter.id;
        section.dataset.chapter = String(index);
        append(
          section,
          make("div", "kicker", chapter.kicker),
          make("h2", "", chapter.title),
          make("p", "chapter-copy", chapter.plain),
          renderExample(chapter.example),
          chapter.visual ? renderFlow(chapter.visual) : null,
          make("div", "takeaway", chapter.takeaway)
        );
        chapters.appendChild(section);
      });

      nav.appendChild(navItems);
      append(shell, nav, chapters);
      navButtons[0].classList.add("active");
      navButtons[0].setAttribute("aria-current", "step");

      const observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          const activeIndex = Number(entry.target.dataset.chapter);
          navButtons.forEach(function (button, index) {
            button.classList.toggle("active", index === activeIndex);
            if (index === activeIndex) button.setAttribute("aria-current", "step");
            else button.removeAttribute("aria-current");
          });
        });
      }, { rootMargin: "-30% 0px -50% 0px", threshold: 0.05 });

      chapters.querySelectorAll(".chapter").forEach(function (chapter) {
        observer.observe(chapter);
      });
      return shell;
    }

    function renderCheck() {
      const section = make("section", "learning-check");
      append(
        section,
        make("div", "kicker", "Check your understanding"),
        make("h2", "", LESSON.check.question),
        make("p", "check-instruction", "Pause and answer in your own words before revealing the explanation.")
      );
      const disclosure = make("details", "");
      append(
        disclosure,
        make("summary", "", "Reveal the answer"),
        append(
          make("div", "check-answer"),
          make("p", "", LESSON.check.answer),
          make("p", "check-why", LESSON.check.why)
        )
      );
      section.appendChild(disclosure);
      return section;
    }

    function updateProgress() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const progress = max > 0 ? Math.min(1, window.scrollY / max) : 0;
      document.getElementById("page-progress").style.width = progress * 100 + "%";
    }

    function init() {
      document.title = LESSON.meta.title + " · Teach";
      document.getElementById("subject").textContent = LESSON.meta.subject;
      append(
        document.getElementById("app"),
        renderHero(),
        renderLesson(),
        renderCheck()
      );
      updateProgress();
      window.addEventListener("scroll", updateProgress, { passive: true });
    }

    init();
  </script>
</body>
</html>
